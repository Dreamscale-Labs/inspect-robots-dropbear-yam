name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --python 3.12 --extra dev --extra hardware
      - run: uv run ruff check .
      - run: uv run mypy src/dropbear_yam
      - run: uv run pytest -q
